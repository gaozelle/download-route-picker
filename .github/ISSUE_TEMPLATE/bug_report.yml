name: 故障报告
description: 无法安装、配置、测速或下载时使用
title: "[故障] "
labels: ["bug", "beta"]
body:
  - type: markdown
    attributes:
      value: "感谢反馈。请勿公开订阅地址、节点凭据、控制器密钥或个人路径。"
  - type: dropdown
    id: stage
    attributes:
      label: 问题发生在哪一步？
      options:
        - 安装或首次打开
        - 环境检查
        - 安装专用配置
        - 线路测速
        - 文件下载
        - 下载完成后的操作
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS 版本和 Mac 芯片
      placeholder: "例如：macOS 15.6，Intel"
    validations:
      required: true
  - type: input
    id: clash
    attributes:
      label: Clash Verge 与 Mihomo 版本
      placeholder: "例如：Clash Verge 2.5.2，Mihomo 1.19.29"
    validations:
      required: true
  - type: dropdown
    id: tun
    attributes:
      label: TUN 模式
      options: ["已开启", "未开启", "不确定"]
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 发生了什么？
      description: 请说明操作步骤、实际结果和预期结果。
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已确认内容中不含订阅地址、密钥、节点凭据或未遮挡的个人路径。
          required: true

